<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="robots" content="noindex, nofollow">
<title>To My Jess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261013f">
</head>
<body class="page-landing">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>

<main class="landing">
  <section class="glass card-enter" aria-labelledby="landing-title">
    <p class="eyebrow">a little surprise</p>
    <h1 id="landing-title" class="landing-title">scan mo nakakagulat yan</h1>

    <div class="qr-stage">
      <div class="qr-ring" aria-hidden="true"></div>
      <button type="button" class="qr-frame" id="qrFrame" aria-label="View QR code full screen">
        <div id="qr" class="qr" role="img" aria-label="QR code that opens the surprise message"></div>
      </button>
    </div>

    <div class="qr-tools">
      <button type="button" class="chip" id="qrFull">View full screen</button>
      <button type="button" class="chip" id="qrSave">Save QR</button>
    </div>

    <p class="host-note" id="hostNote" hidden></p>

    <a class="surprise-link" id="openSurprise" href="letter.html">Open My Surprise 💌</a>
  </section>
</main>

<div class="qr-modal" id="qrModal" role="dialog" aria-modal="true" aria-label="QR code, full screen" hidden>
  <div class="qr-modal-inner">
    <div id="qrBig" class="qr qr-big"></div>
    <img id="qrImg" class="qr-big qr-img" alt="QR code" hidden>
    <p class="qr-modal-hint" id="qrHint">point your camera here ✨</p>
    <div class="qr-save-actions" id="qrSaveActions" hidden>
      <a class="chip chip-solid" id="qrDownload" href="#" download="for-jess-qr.png">I-download ang QR</a>
      <button type="button" class="chip chip-solid" id="qrShare" hidden>Save to Photos / Share</button>
    </div>
    <button type="button" class="chip" id="qrClose">Close</button>
  </div>
</div>

<script src="assets/qrcode.js?v=20261013f"></script>
<script src="assets/sky.js?v=20261013f"></script>
<script src="assets/landing.js?v=20261013f"></script>
</body>
</html>
